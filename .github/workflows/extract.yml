name: Extract qureo.zip
on:
  push:
    paths:
      - 'qureo.zip'
  workflow_dispatch: # ده السطر اللي هيخلينا نشغله يدوياً

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and cleanup
        run: |
          if [ -f qureo.zip ]; then
            unzip -o qureo.zip -d .
            rm qureo.zip
          fi
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "auto-extract qureo.zip [skip ci]" || exit 0
          git push
